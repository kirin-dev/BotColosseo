<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Crystal Run: Extraction policy architecture</title>
  <desc id="desc">A fair first-person observation feeds one shared CNN-GRU Strong policy. Three small bounded residual adapters derive Aggressive, Defensive, and Explorer policies from the frozen Strong base.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#162238"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fa8c7"/>
    </marker>
    <style>
      .heading { font: 700 28px Inter, Arial, sans-serif; fill: #f4f7fb; }
      .label { font: 700 20px Inter, Arial, sans-serif; fill: #f4f7fb; }
      .body { font: 400 15px Inter, Arial, sans-serif; fill: #bdcbe0; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #8fa8c7; }
      .edge { fill: none; stroke: #8fa8c7; stroke-width: 2.2; marker-end: url(#arrow); }
      .card { stroke-width: 1.5; rx: 16; }
    </style>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#background)"/>
  <text x="48" y="54" class="heading">One capable Bot, three learned play styles</text>
  <text x="48" y="82" class="body">The deployed Actor uses only first-person pixels and the player's own public state.</text>

  <rect x="48" y="156" width="220" height="152" class="card" fill="#15263b" stroke="#3d6286"/>
  <text x="72" y="194" class="label">Fair observation</text>
  <text x="72" y="227" class="body">84×84 visual frame</text>
  <text x="72" y="251" class="body">own HP, ammo, backpack</text>
  <text x="72" y="275" class="body">timer + previous action</text>

  <rect x="354" y="156" width="252" height="152" class="card" fill="#14334a" stroke="#3c88a7"/>
  <text x="378" y="194" class="label">Strong Base</text>
  <text x="378" y="227" class="body">visual CNN + GRU</text>
  <text x="378" y="251" class="body">BC → recurrent PPO</text>
  <text x="378" y="275" class="body">frozen shared Actor hash</text>

  <path d="M268 232 H342" class="edge"/>
  <path d="M606 232 H664 V142 H700" class="edge"/>
  <path d="M606 232 H700" class="edge"/>
  <path d="M606 232 H664 V322 H700" class="edge"/>

  <rect x="700" y="102" width="446" height="80" class="card" fill="#3c2024" stroke="#d15b64"/>
  <text x="724" y="134" class="label">Aggressive</text>
  <text x="724" y="159" class="body">bounded residual → hit, kill, loot cache, extract</text>

  <rect x="700" y="192" width="446" height="80" class="card" fill="#17382f" stroke="#50a987"/>
  <text x="724" y="224" class="label">Defensive</text>
  <text x="724" y="249" class="body">bounded residual → disengage, protect value, extract</text>

  <rect x="700" y="282" width="446" height="80" class="card" fill="#342b16" stroke="#c99b3f"/>
  <text x="724" y="314" class="label">Explorer</text>
  <text x="724" y="339" class="body">bounded residual → search, upgrade backpack, extract</text>

  <text x="48" y="422" class="small">Training may use privileged Critic and reward ledgers. Public inference exports the Actor only.</text>
  <text x="1146" y="422" class="small" text-anchor="end">Crystal Run: Extraction</text>
</svg>
