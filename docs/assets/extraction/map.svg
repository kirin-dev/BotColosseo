<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">BotColosseo randomized-loot arena</title>
  <desc id="desc">A 1v1 extraction arena with two spawns, two extraction zones, and sixteen safe loot anchors. Seven items are assigned to anchors each raid.</desc>
  <defs>
    <style>
      .label { font: 700 15px Inter, Arial, sans-serif; fill: #e9eef5; letter-spacing: .04em; }
      .small { font: 600 12px Inter, Arial, sans-serif; fill: #9eabba; }
      .note { font: 700 13px Inter, Arial, sans-serif; fill: #c8d5e5; text-anchor: middle; }
      .value { font: 800 13px Inter, Arial, sans-serif; fill: #091016; text-anchor: middle; dominant-baseline: central; }
      .zone { fill: #143c37; stroke: #77e6c4; stroke-width: 2; }
      .wall { fill: #171e28; stroke: #3a4554; stroke-width: 2; }
      .anchor { fill: #27384c; stroke: #72a7ff; stroke-width: 2; }
    </style>
  </defs>
  <rect width="920" height="560" rx="20" fill="#0c1118"/>
  <rect x="60" y="54" width="800" height="418" rx="18" class="wall"/>
  <rect x="326" y="54" width="268" height="66" rx="8" class="zone"/>
  <rect x="326" y="406" width="268" height="66" rx="8" class="zone"/>
  <text x="460" y="87" class="label" text-anchor="middle">NORTH EXTRACTION</text>
  <text x="460" y="439" class="label" text-anchor="middle">SOUTH EXTRACTION</text>

  <rect x="326" y="140" width="268" height="246" rx="12" fill="#202a37" stroke="#4b5868" stroke-width="2"/>
  <text x="460" y="176" class="small" text-anchor="middle">CONTESTED CENTER</text>
  <text x="460" y="248" class="note">16 SAFE LOOT ANCHORS</text>
  <text x="460" y="273" class="label" text-anchor="middle">7 ITEMS SAMPLED PER RAID</text>
  <text x="460" y="298" class="small" text-anchor="middle">values 10 / 25 / 50</text>

  <circle cx="270" cy="151" r="20" fill="#e7edf5"/>
  <text x="270" y="151" class="value">A</text>
  <text x="270" y="184" class="small" text-anchor="middle">SPAWN</text>
  <circle cx="650" cy="375" r="20" fill="#e7edf5"/>
  <text x="650" y="375" class="value">B</text>
  <text x="650" y="408" class="small" text-anchor="middle">SPAWN</text>

  <g aria-label="Sixteen safe candidate loot anchors">
    <circle cx="145" cy="145" r="10" class="anchor"/><circle cx="210" cy="225" r="10" class="anchor"/>
    <circle cx="145" cy="305" r="10" class="anchor"/><circle cx="230" cy="385" r="10" class="anchor"/>
    <circle cx="320" cy="215" r="10" class="anchor"/><circle cx="320" cy="315" r="10" class="anchor"/>
    <circle cx="390" cy="205" r="10" class="anchor"/><circle cx="390" cy="325" r="10" class="anchor"/>
    <circle cx="530" cy="205" r="10" class="anchor"/><circle cx="530" cy="325" r="10" class="anchor"/>
    <circle cx="600" cy="215" r="10" class="anchor"/><circle cx="600" cy="315" r="10" class="anchor"/>
    <circle cx="690" cy="145" r="10" class="anchor"/><circle cx="775" cy="225" r="10" class="anchor"/>
    <circle cx="775" cy="305" r="10" class="anchor"/><circle cx="710" cy="385" r="10" class="anchor"/>
  </g>

  <g transform="translate(145 512)">
    <circle cx="8" cy="0" r="8" class="anchor"/><text x="26" y="4" class="small">candidate loot anchor</text>
    <path d="M263 -7 L275 7 M275 -7 L263 7" stroke="#e6bc62" stroke-width="2"/><text x="287" y="4" class="small">random assignment each raid</text>
    <rect x="573" y="-8" width="16" height="16" rx="3" class="zone"/><text x="599" y="4" class="small">extraction zone</text>
  </g>
</svg>
