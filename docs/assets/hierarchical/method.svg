<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Hierarchical visual policy with runtime controls</title>
  <desc id="desc">Fair visual inputs feed a recurrent executor. Its preceding visual features feed a strategic Actor, which returns a command. Style modulates the high Actor; difficulty conditions both layers. Model identity stays fixed during runtime control changes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#607085" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#202731;font-size:17px}
      .small{font-size:14px;fill:#607085}
      .heading{font-size:20px;font-weight:700}
      .box{fill:#fff;stroke:#cbd5df;stroke-width:1.5;rx:12}
      .flow{fill:none;stroke:#607085;stroke-width:2;marker-end:url(#arrow)}
      .control{fill:none;stroke:#607085;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="430" fill="white"/>
  <rect class="box" x="30" y="178" width="230" height="108"/>
  <text class="heading" x="50" y="210">Fair observation</text>
  <text x="50" y="237">First-person pixels</text>
  <text class="small" x="50" y="261">Own state · action history</text>
  <rect class="box" x="475" y="38" width="280" height="100" style="stroke:#3488d4"/>
  <text class="heading" x="495" y="70">Strategic Actor · goals</text>
  <text x="495" y="96">GRU · command policy</text>
  <text class="small" x="495" y="120">Replan every 8 low decisions*</text>
  <rect class="box" x="475" y="206" width="280" height="104" style="stroke:#3488d4"/>
  <text class="heading" x="495" y="238">Shared executor · act</text>
  <text x="495" y="264">CNN–GRU · action policy</text>
  <text class="small" x="495" y="288">One decision per 4 engine tics</text>
  <rect class="box" x="900" y="221" width="185" height="72"/>
  <text class="heading" x="920" y="252">Game action</text>
  <text class="small" x="920" y="276">Move · turn · fire</text>
  <rect class="box" x="245" y="38" width="175" height="100" style="fill:#f3f8fe"/>
  <text class="heading" x="265" y="72">Style input</text>
  <text class="small" x="265" y="97">Aggressive / Defensive</text>
  <text class="small" x="265" y="119">Explorer · combinations</text>
  <rect class="box" x="30" y="332" width="230" height="66" style="fill:#f3f8fe"/>
  <text class="heading" x="50" y="361">Difficulty input</text>
  <text class="small" x="50" y="384">Easy → Hard · both layers</text>
  <path class="flow" d="M260 232H475"/>
  <path class="flow" d="M615 138V206"/>
  <text class="small" x="628" y="174">Command</text>
  <path class="flow" d="M755 258H900"/>
  <path class="flow" d="M755 220H830V88H755"/>
  <text class="small" x="846" y="117">Previous recurrent</text>
  <text class="small" x="846" y="138">visual features</text>
  <text class="small" x="846" y="159">+ public own state</text>
  <path class="control" d="M420 88H475"/>
  <text class="small" x="425" y="77">FiLM</text>
  <path class="control" d="M260 365H445V116H475"/>
  <path class="control" d="M445 365H615V310"/>
  <text class="small" x="672" y="363">Change controls, keep model weights and memory.</text>
  <text class="small" x="475" y="407">*Public events may trigger earlier replanning. Weights stay fixed during play.</text>
</svg>
