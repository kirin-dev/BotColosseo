<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="title desc">
  <title id="title">Two-level policy: plan goals, execute actions</title>
  <desc id="desc">The high-level GRU planner receives public own state, command history and previous low-level visual features. Style and difficulty condition planning. A seven-command interface connects it to the shared low-level CNN-GRU executor, which also receives current first-person observations and difficulty. Both recurrent memories persist when controls change. This diagram shows the current model, not a VLM or diffusion policy.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#556b80" stroke-width="1.6"/></marker>
    <marker id="feedback" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8896a7" stroke-width="1.6"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#26374a;font-size:18px}
      .heading{font-size:24px;font-weight:700;letter-spacing:.4px}
      .label{font-size:20px;font-weight:700}
      .small{font-size:16px;fill:#5d7183}
      .blue{fill:#2868a5}.green{fill:#247964}
      .flow{fill:none;stroke:#556b80;stroke-width:2.5;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#8896a7;stroke-width:2;marker-end:url(#feedback)}
    </style>
  </defs>
  <rect width="1200" height="744" fill="white"/>
  <!-- Large colored regions identify the two timescales. -->
  <rect x="270" y="36" width="650" height="232" rx="20" fill="#f1f6fc" stroke="#c5d9ee" stroke-width="1.5"/>
  <text class="heading blue" x="298" y="79">HIGH-LEVEL PLANNER</text>
  <text class="small" x="298" y="108">Replan every 8 low-level steps*</text>
  <rect x="674" y="59" width="218" height="58" rx="12" fill="#e2edfa"/>
  <text class="label blue" x="783" y="84" text-anchor="middle">Style + Difficulty</text>
  <text class="small" x="783" y="105" text-anchor="middle">FiLM conditioning</text>
  <rect x="310" y="151" width="242" height="80" rx="12" fill="white" stroke="#b5cfe9"/>
  <text class="label" x="431" y="184" text-anchor="middle">Planning backbone</text>
  <text class="small" x="431" y="211" text-anchor="middle">Current: recurrent GRU</text>
  <path class="flow" d="M552 191H602"/>
  <rect x="610" y="151" width="270" height="80" rx="12" fill="white" stroke="#b5cfe9"/>
  <text class="label" x="745" y="184" text-anchor="middle">Command policy</text>
  <text class="small" x="745" y="211" text-anchor="middle">Choose what to do next</text>
  <path d="M783 117V132H431V143" class="flow"/>
  <path d="M783 132V143" class="flow"/>
  <!-- High-level public input is not a second privileged observation stream. -->
  <rect x="24" y="132" width="210" height="118" rx="14" fill="#f8fafc" stroke="#dce4ed"/>
  <text class="label" x="129" y="165" text-anchor="middle">Public own state</text>
  <text class="small" x="129" y="193" text-anchor="middle">Command history</text>
  <text class="small" x="129" y="220" text-anchor="middle">Elapsed command time</text>
  <path class="flow" d="M234 191H302"/>
  <!-- A named discrete interface, not an unimplemented latent VLM bridge. -->
  <path class="flow" d="M745 231V291"/>
  <rect x="610" y="299" width="270" height="74" rx="13" fill="#fff" stroke="#9bb3ca" stroke-width="1.8"/>
  <text class="label" x="745" y="328" text-anchor="middle">COMMAND INTERFACE</text>
  <text class="small" x="745" y="354" text-anchor="middle">7 discrete goals</text>
  <text class="small" x="310" y="322">Search N / C / S</text>
  <text class="small" x="310" y="346">Engage · disengage</text>
  <text class="small" x="310" y="370">Extract N / S</text>
  <rect x="270" y="407" width="650" height="228" rx="20" fill="#eff8f4" stroke="#bcdccc" stroke-width="1.5"/>
  <text class="heading green" x="298" y="450">LOW-LEVEL EXECUTOR</text>
  <text class="small" x="298" y="477">Act every 4 engine tics</text>
  <rect x="24" y="461" width="210" height="140" rx="14" fill="#f8fafc" stroke="#dce4ed"/>
  <text class="label" x="129" y="494" text-anchor="middle">First-person pixels</text>
  <text class="small" x="129" y="525" text-anchor="middle">Public own state</text>
  <text class="small" x="129" y="552" text-anchor="middle">Previous action</text>
  <text class="small" x="129" y="579" text-anchor="middle">No hidden enemy state</text>
  <path class="flow" d="M234 546H302"/>
  <rect x="310" y="507" width="242" height="78" rx="12" fill="white" stroke="#add2bf"/>
  <text class="label" x="431" y="539" text-anchor="middle">Visual encoder + GRU</text>
  <text class="small" x="431" y="565" text-anchor="middle">Maintain local visual history</text>
  <path class="flow" d="M552 546H602"/>
  <rect x="610" y="507" width="270" height="78" rx="12" fill="white" stroke="#add2bf"/>
  <text class="label" x="745" y="539" text-anchor="middle">Action policy</text>
  <text class="small" x="745" y="565" text-anchor="middle">Execute the selected goal</text>
  <path class="flow" d="M745 373V489H431V499"/>
  <path class="flow" d="M745 489V499"/>
  <rect x="792" y="429" width="104" height="43" rx="10" fill="#dcefe5"/>
  <text class="small green" x="844" y="456" text-anchor="middle">Difficulty</text>
  <path d="M844 472V489H745" fill="none" stroke="#556b80" stroke-width="2.5"/>
  <circle cx="745" cy="489" r="3" fill="#556b80"/>
  <text class="small green" x="310" y="615">Shared skills · persistent recurrent memory</text>
  <!-- Feedback is kept outside both panels, separate from command flow. -->
  <path class="feedback" d="M920 546H999V191H928"/>
  <text class="small" x="1020" y="332">Previous-step</text>
  <text class="small" x="1020" y="357">visual features</text>
  <path class="flow" d="M745 585V669"/>
  <rect x="610" y="677" width="270" height="52" rx="12" fill="#26374a"/>
  <text x="745" y="709" text-anchor="middle" style="fill:white;font-weight:700">Move · turn · fire</text>
  <text class="small" x="24" y="693">*Public events may trigger earlier replanning.</text>
  <text class="small" x="24" y="720">Change controls, keep model weights.</text>
</svg>
