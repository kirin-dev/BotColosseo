<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #e8edf4; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #aeb8c5; }
    .arena { fill: #18202b; stroke: #657184; stroke-width: 2; }
    .center { fill: #232f3e; }
    .extract { fill: #194d43; stroke: #36d6af; stroke-width: 2; }
    .spawn { fill: #f7f9fc; stroke: #111820; stroke-width: 2; }
    .loot10 { fill: #64b5f6; }
    .loot25 { fill: #ffd54f; }
    .loot50 { fill: #ff7043; }
    .label { font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: #101720; }
    .legend { font-size: 14px; }
  </style>
  <rect width="1200" height="620" fill="#0f141c"/>
  <text x="40" y="45" class="title">Crystal Run: Extraction — Layout Review Gate</text>
  <text x="40" y="72" class="subtitle">Same geometry and rules; only the initial 10/25-value loot distribution changes. The 50-value center objective stays fixed.</text>

  <g transform="translate(40 110)">
    <text x="260" y="-15" class="title" text-anchor="middle">Training / Validation: base</text>
    <rect x="0" y="0" width="520" height="360" rx="8" class="arena"/>
    <rect x="173" y="56" width="174" height="248" class="center"/>
    <rect x="173" y="0" width="174" height="56" class="extract"/>
    <rect x="173" y="304" width="174" height="56" class="extract"/>
    <text x="260" y="30" class="subtitle" text-anchor="middle">NORTH EXTRACTION</text>
    <text x="260" y="338" class="subtitle" text-anchor="middle">SOUTH EXTRACTION</text>
    <circle cx="152" cy="60" r="14" class="spawn"/><text x="152" y="60" class="label">H</text>
    <circle cx="368" cy="300" r="14" class="spawn"/><text x="368" y="300" class="label">O</text>
    <g><circle cx="84" cy="72" r="14" class="loot10"/><text x="84" y="72" class="label">10</text></g>
    <g><circle cx="84" cy="288" r="14" class="loot10"/><text x="84" y="288" class="label">10</text></g>
    <g><circle cx="436" cy="72" r="14" class="loot10"/><text x="436" y="72" class="label">10</text></g>
    <g><circle cx="436" cy="288" r="14" class="loot10"/><text x="436" y="288" class="label">10</text></g>
    <g><circle cx="184" cy="180" r="16" class="loot25"/><text x="184" y="180" class="label">25</text></g>
    <g><circle cx="336" cy="180" r="16" class="loot25"/><text x="336" y="180" class="label">25</text></g>
    <g><circle cx="260" cy="180" r="19" class="loot50"/><text x="260" y="180" class="label">50</text></g>
  </g>

  <g transform="translate(640 110)">
    <text x="260" y="-15" class="title" text-anchor="middle">Heldout / Official Test: heldout-a</text>
    <rect x="0" y="0" width="520" height="360" rx="8" class="arena"/>
    <rect x="173" y="56" width="174" height="248" class="center"/>
    <rect x="173" y="0" width="174" height="56" class="extract"/>
    <rect x="173" y="304" width="174" height="56" class="extract"/>
    <text x="260" y="30" class="subtitle" text-anchor="middle">NORTH EXTRACTION</text>
    <text x="260" y="338" class="subtitle" text-anchor="middle">SOUTH EXTRACTION</text>
    <circle cx="152" cy="60" r="14" class="spawn"/><text x="152" y="60" class="label">H</text>
    <circle cx="368" cy="300" r="14" class="spawn"/><text x="368" y="300" class="label">O</text>
    <g><circle cx="84" cy="180" r="14" class="loot10"/><text x="84" y="180" class="label">10</text></g>
    <g><circle cx="436" cy="180" r="14" class="loot10"/><text x="436" y="180" class="label">10</text></g>
    <g><circle cx="260" cy="96" r="14" class="loot10"/><text x="260" y="96" class="label">10</text></g>
    <g><circle cx="260" cy="264" r="14" class="loot10"/><text x="260" y="264" class="label">10</text></g>
    <g><circle cx="84" cy="72" r="16" class="loot25"/><text x="84" y="72" class="label">25</text></g>
    <g><circle cx="436" cy="288" r="16" class="loot25"/><text x="436" y="288" class="label">25</text></g>
    <g><circle cx="260" cy="180" r="19" class="loot50"/><text x="260" y="180" class="label">50</text></g>
  </g>

  <g transform="translate(40 525)">
    <circle cx="15" cy="0" r="12" class="loot10"/><text x="15" y="0" class="label">10</text>
    <text x="38" y="5" class="legend">low-value loot</text>
    <circle cx="190" cy="0" r="13" class="loot25"/><text x="190" y="0" class="label">25</text>
    <text x="215" y="5" class="legend">medium-value loot</text>
    <circle cx="390" cy="0" r="15" class="loot50"/><text x="390" y="0" class="label">50</text>
    <text x="418" y="5" class="legend">contested objective</text>
    <text x="650" y="5" class="legend">Unchanged: 100 HP · 20 damage · 30 ammo · 3 slots · 30s opening · 3s extraction · two extraction zones</text>
  </g>
</svg>
