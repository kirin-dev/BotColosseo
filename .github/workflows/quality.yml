name: Portable quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[training,dev]"

      - name: Lint
        run: python -m ruff check src scripts tests

      - name: Run unit tests
        run: python -m pytest -q tests/unit

      - name: Run portable ViZDoom integration
        run: python -m pytest -q tests/integration

      - name: Audit committed Showcase evidence and media hashes
        run: |
          python -m botcolosseo.cli.audit_extraction_showcase \
            --selection reports/extraction/showcase/selection.json \
            --board-manifest reports/extraction/showcase/manifest.json \
            --method docs/assets/extraction/method.svg \
            --experiment-identity reports/extraction/showcase/experiment-identity.json \
            --output /tmp/botcolosseo-showcase-audit.json
          cmp reports/extraction/showcase/audit.json \
            /tmp/botcolosseo-showcase-audit.json
